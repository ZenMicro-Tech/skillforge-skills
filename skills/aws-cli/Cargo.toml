[workspace]

[package]
name    = "aws-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aws-cli"
path = "src/main.rs"

[dependencies]
skillforge-runtime = { path = "../../../ai-skills-platform/crates/skillforge-runtime" }
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt", "macros"] }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3  = "1"
aws-sdk-ec2 = "1"
aws-sdk-sts = "1"
aws-sdk-iam = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
