[workspace]

[package]
name    = "example-skill"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "example-skill"
path = "src/main.rs"

[dependencies]
skillforge-runtime = { path = "../../../ai-skills-platform/crates/skillforge-runtime" }
anyhow             = "1"
serde_json         = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
