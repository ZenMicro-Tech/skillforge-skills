[workspace]

[package]
name    = "git-skill"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "git"
path = "src/main.rs"

[dependencies]
skillforge-runtime = { path = "../../ai-skills-platform/crates/skillforge-runtime" }
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
git2               = { version = "0.19", features = ["vendored-openssl"] }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
