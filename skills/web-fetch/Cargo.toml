[workspace]

[package]
name    = "web-fetch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "web-fetch"
path = "src/main.rs"

[dependencies]
skillforge-runtime = { path = "../../skillforge/crates/skillforge-runtime" }
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt", "macros"] }
reqwest            = { version = "0.12", features = ["rustls-tls"], default-features = false }
scraper            = "0.20"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
