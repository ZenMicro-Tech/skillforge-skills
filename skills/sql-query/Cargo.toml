[workspace]

[package]
name    = "sql-query"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "sql-query"
path = "src/main.rs"

[dependencies]
skillforge-runtime = { path = "../../skillforge/crates/skillforge-runtime" }
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt", "macros"] }
rusqlite           = { version = "0.31", features = ["bundled"] }
tokio-postgres        = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls                = "0.23"
url                   = "2"
webpki-roots          = "0.26"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
