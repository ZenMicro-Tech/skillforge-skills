name: Build & Publish Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  discover:
    name: Discover skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: List all skill directories
        run: |
          skills=$(ls skills/*/skill.toml 2>/dev/null \
            | xargs -I{} dirname {} \
            | xargs -I{} basename {} \
            | grep -v '^example-skill$' \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "all_skills=$skills" >> "$GITHUB_OUTPUT"
          echo "All skills: $skills"

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            workflow:
              - '.github/workflows/publish-skills.yml'
            git:
              - 'skills/git/**'
            github:
              - 'skills/github/**'
            http-client:
              - 'skills/http-client/**'
            sql-query:
              - 'skills/sql-query/**'
            web-fetch:
              - 'skills/web-fetch/**'

      - id: filter
        name: Determine which skills to build
        run: |
          ALL_SKILLS='${{ steps.find.outputs.all_skills }}'
          CHANGED_FILTERS='${{ steps.changes.outputs.changes }}'

          # If the workflow file itself changed, rebuild everything
          if echo "$CHANGED_FILTERS" | jq -e '. | index("workflow")' > /dev/null 2>&1; then
            echo "Workflow changed — rebuilding all skills"
            echo "skills=$ALL_SKILLS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract skill names from changed filters (exclude non-skill filters like "workflow")
          CHANGED_SKILLS=$(echo "$CHANGED_FILTERS" | jq -c '[.[] | select(. != "workflow")]')

          if [ "$CHANGED_SKILLS" = "[]" ]; then
            echo "No skill changes detected — nothing to build"
            echo "skills=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Changed skills: $CHANGED_SKILLS"
            echo "skills=$CHANGED_SKILLS" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish-linux-amd64:
    name: "Build & Publish ${{ matrix.skill }} (linux-amd64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-x86_64-unknown-linux-gnu" --dir bin
          mv bin/skillforge-x86_64-unknown-linux-gnu bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: |
          skillforge publish ${{ matrix.skill }} \
            --path skills/${{ matrix.skill }} \
            --target x86_64-unknown-linux-musl

  build-and-publish-linux-arm64:
    name: "Build & Publish ${{ matrix.skill }} (linux-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-arm64
      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-aarch64-unknown-linux-gnu" --dir bin
          mv bin/skillforge-aarch64-unknown-linux-gnu bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: |
          skillforge publish ${{ matrix.skill }} \
            --path skills/${{ matrix.skill }} \
            --target aarch64-unknown-linux-musl

  build-and-publish-darwin-arm64:
    name: "Build & Publish ${{ matrix.skill }} (darwin-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-darwin-arm64
      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-aarch64-apple-darwin" --dir bin
          mv bin/skillforge-aarch64-apple-darwin bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: |
          skillforge publish ${{ matrix.skill }} \
            --path skills/${{ matrix.skill }} \
            --target aarch64-apple-darwin

  create-index:
    name: "Create index (${{ matrix.skill }})"
    needs: [discover, build-and-publish-linux-amd64, build-and-publish-linux-arm64, build-and-publish-darwin-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-x86_64-unknown-linux-gnu" --dir bin
          mv bin/skillforge-x86_64-unknown-linux-gnu bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Create manifest index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: |
          skillforge publish ${{ matrix.skill }} \
            --path skills/${{ matrix.skill }} \
            --create-index \
            --target aarch64-apple-darwin \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl

  # Build-only for PRs
  build-check:
    name: "Build ${{ matrix.skill }} (check)"
    needs: [discover]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
