name: Build & Publish Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  discover:
    name: Discover skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.find.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: List skill directories
        run: |
          skills=$(ls skills/*/skill.toml 2>/dev/null \
            | xargs -I{} dirname {} \
            | xargs -I{} basename {} \
            | grep -v '^example-skill$' \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Found skills: $skills"

  build-linux-amd64:
    name: "Build ${{ matrix.skill }} (linux-amd64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-x86_64-unknown-linux-musl
          path: skills/${{ matrix.skill }}/target/x86_64-unknown-linux-musl/release/${{ matrix.skill }}
          retention-days: 1

  build-linux-arm64:
    name: "Build ${{ matrix.skill }} (linux-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-arm64
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-unknown-linux-musl
          path: skills/${{ matrix.skill }}/target/aarch64-unknown-linux-musl/release/${{ matrix.skill }}
          retention-days: 1

  build-darwin-arm64:
    name: "Build ${{ matrix.skill }} (darwin-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-darwin-arm64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-apple-darwin
          path: skills/${{ matrix.skill }}/target/release/${{ matrix.skill }}
          retention-days: 1

  publish:
    name: "Publish ${{ matrix.skill }}"
    needs: [discover, build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge

      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-x86_64-unknown-linux-gnu" --dir bin
          mv bin/skillforge-x86_64-unknown-linux-gnu bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-x86_64-unknown-linux-musl
          path: skills/${{ matrix.skill }}/target/x86_64-unknown-linux-musl/release

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-unknown-linux-musl
          path: skills/${{ matrix.skill }}/target/aarch64-unknown-linux-musl/release

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-apple-darwin
          path: skills/${{ matrix.skill }}/target/aarch64-apple-darwin/release

      - name: Publish to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
        run: |
          chmod +x skills/${{ matrix.skill }}/target/x86_64-unknown-linux-musl/release/${{ matrix.skill }}
          chmod +x skills/${{ matrix.skill }}/target/aarch64-unknown-linux-musl/release/${{ matrix.skill }}
          chmod +x skills/${{ matrix.skill }}/target/aarch64-apple-darwin/release/${{ matrix.skill }}

          skillforge publish ${{ matrix.skill }} \
            --path skills/${{ matrix.skill }} \
            --repo ghcr.io/zenmicro-tech/skillforge/skills/${{ matrix.skill }} \
            --target aarch64-apple-darwin \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl

  # Build-only for PRs
  build-check:
    name: "Build ${{ matrix.skill }} (check)"
    needs: [discover]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
