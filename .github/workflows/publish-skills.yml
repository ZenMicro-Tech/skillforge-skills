name: Build & Publish Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io/zenmicro-tech/skillforge/skills

jobs:
  discover:
    name: Discover skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.find.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: List skill directories
        run: |
          skills=$(ls skills/*/skill.toml 2>/dev/null \
            | xargs -I{} dirname {} \
            | xargs -I{} basename {} \
            | grep -v '^example-skill$' \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Found skills: $skills"

  build-linux-amd64:
    name: "Build ${{ matrix.skill }} (linux-amd64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-x86_64-unknown-linux-gnu
          path: skills/${{ matrix.skill }}/target/release/${{ matrix.skill }}
          retention-days: 1

  build-linux-arm64:
    name: "Build ${{ matrix.skill }} (linux-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-arm64
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-unknown-linux-gnu
          path: skills/${{ matrix.skill }}/target/aarch64-unknown-linux-gnu/release/${{ matrix.skill }}
          retention-days: 1

  build-darwin-arm64:
    name: "Build ${{ matrix.skill }} (darwin-arm64)"
    needs: [discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-darwin-arm64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-apple-darwin
          path: skills/${{ matrix.skill }}/target/release/${{ matrix.skill }}
          retention-days: 1

  publish:
    name: "Publish ${{ matrix.skill }} (all platforms)"
    needs: [discover, build-linux-amd64, build-linux-arm64, build-darwin-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge

      - name: Install skillforge CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZenMicro-Tech/skillforge --pattern "skillforge-x86_64-unknown-linux-gnu" --dir bin
          mv bin/skillforge-x86_64-unknown-linux-gnu bin/skillforge
          chmod +x bin/skillforge
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ORAS
        run: |
          curl -sLO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xzf oras_1.2.0_linux_amd64.tar.gz
          sudo mv oras /usr/local/bin/

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Read skill version
        id: version
        run: |
          version=$(grep '^version' skills/${{ matrix.skill }}/skill.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-x86_64-unknown-linux-gnu
          path: skills/${{ matrix.skill }}/target/release

      - name: Download linux-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-unknown-linux-gnu
          path: skills/${{ matrix.skill }}/target/aarch64-unknown-linux-gnu/release

      - name: Download darwin-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.skill }}-aarch64-apple-darwin
          path: skills/${{ matrix.skill }}/target/aarch64-apple-darwin/release

      - name: Publish and tag all platforms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.version }}
          SKILL: ${{ matrix.skill }}
        run: |
          IMAGE="${REGISTRY}/${SKILL}"

          chmod +x skills/${SKILL}/target/release/${SKILL}
          chmod +x skills/${SKILL}/target/aarch64-unknown-linux-gnu/release/${SKILL}
          chmod +x skills/${SKILL}/target/aarch64-apple-darwin/release/${SKILL}

          # Publish linux-amd64 and retag
          skillforge publish ${SKILL} \
            --path skills/${SKILL} \
            --target x86_64-unknown-linux-gnu
          oras tag "${IMAGE}:${VERSION}" "${VERSION}-linux-amd64"

          # Publish linux-arm64 (overwrites :VERSION) and retag
          skillforge publish ${SKILL} \
            --path skills/${SKILL} \
            --target aarch64-unknown-linux-gnu
          oras tag "${IMAGE}:${VERSION}" "${VERSION}-linux-arm64"

          # Publish darwin-arm64 (overwrites :VERSION) and retag
          skillforge publish ${SKILL} \
            --path skills/${SKILL} \
            --target aarch64-apple-darwin
          oras tag "${IMAGE}:${VERSION}" "${VERSION}-darwin-arm64"

      - name: Create and push manifest index
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKILL: ${{ matrix.skill }}
        run: |
          IMAGE="${REGISTRY}/${SKILL}"

          # Fetch each platform manifest descriptor
          oras manifest fetch "${IMAGE}:${VERSION}-linux-amd64" --descriptor > linux-amd64.json
          oras manifest fetch "${IMAGE}:${VERSION}-linux-arm64" --descriptor > linux-arm64.json
          oras manifest fetch "${IMAGE}:${VERSION}-darwin-arm64" --descriptor > darwin-arm64.json

          # Add platform annotations to each descriptor
          jq '. + {"platform": {"os": "linux", "architecture": "amd64"}}' linux-amd64.json > linux-amd64-plat.json
          jq '. + {"platform": {"os": "linux", "architecture": "arm64"}}' linux-arm64.json > linux-arm64-plat.json
          jq '. + {"platform": {"os": "darwin", "architecture": "arm64"}}' darwin-arm64.json > darwin-arm64-plat.json

          # Build the OCI image index
          jq -n --slurpfile a linux-amd64-plat.json \
                --slurpfile b linux-arm64-plat.json \
                --slurpfile c darwin-arm64-plat.json \
            '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$a[0], $b[0], $c[0]]}' > index.json

          # Push the manifest index as the canonical version tag
          oras manifest push "${IMAGE}:${VERSION}" index.json
          oras manifest push "${IMAGE}:latest" index.json

          echo "Pushed manifest index for ${IMAGE}:${VERSION} with 3 platforms"

  # Build-only for PRs
  build-check:
    name: "Build ${{ matrix.skill }} (check)"
    needs: [discover]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZenMicro-Tech/skillforge
          path: skillforge
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: skills/${{ matrix.skill }}
          shared-key: ${{ matrix.skill }}-linux-amd64
      - name: Build
        run: cargo build --release
        working-directory: skills/${{ matrix.skill }}
